name: verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Compile Python
        env:
          PYTHONPYCACHEPREFIX: /tmp/warehouse-python-cache
        run: python -m compileall -q adapters entities interfaces use_cases tests *.py
      - name: Run regression suite
        run: python -m pytest -q --cov=adapters --cov=entities --cov=interfaces --cov=use_cases --cov-report=term --cov-fail-under=85
      - name: Lint Python
        run: ruff check adapters entities interfaces use_cases tests *.py
      - name: Detect dead Python code
        run: vulture adapters entities interfaces use_cases main.py visualize.py benchmarks tests --min-confidence 60
      - name: Check typed architecture
        run: mypy entities interfaces use_cases adapters
